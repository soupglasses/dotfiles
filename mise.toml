[tools]
ansible = "14.3.1"
gitleaks = "8.30.1"
hk = "1.58.1"
pipx = "1.17.2"
yamllint = "1.38.0"

[hooks]
postinstall = "hk install --mise"

[tasks.setup]
description = "Install Ansible collections"
run = "ansible-galaxy collection install -r ansible/requirements.yml"

[tasks.check]
description = "Run all repository checks"
run = "hk check --all"

[tasks.playbook]
description = "Run the complete Ansible playbook"
run = "ansible-playbook ansible/site.yaml"

[tasks.role]
description = "Run one or more Ansible roles by tag"
usage = 'arg "<roles>" var=#true help="Roles or tags to run"'
run = '''
#!/usr/bin/env bash
set -euo pipefail

eval "roles=(${usage_roles?})"
IFS=,
ansible-playbook ansible/site.yaml --tags "${roles[*]}"
'''
