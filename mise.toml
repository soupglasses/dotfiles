[tools]
ansible = "14.3.1"
gitleaks = "8.30.1"
hk = "1.58.1"
pipx = "1.17.2"
yamllint = "1.38.0"

[hooks]
postinstall = "hk install --mise"

[tasks.setup]
description = "Install Ansible collections"
run = "ansible-galaxy collection install -r requirements.yml"

[tasks.check]
description = "Run all repository checks"
run = "hk check --all"

[tasks.playbook]
description = "Run the complete Ansible playbook"
run = "ansible-playbook site.yaml"

[tasks.playbook.env]
ANSIBLE_CONFIG = "ansible.cfg"

[tasks.role]
description = "Run one or more Ansible roles by tag"
usage = 'arg "<roles>" var=#true help="Roles or tags to run"'
run = 'ansible-playbook --inventory "localhost," site.yaml --tags "{{ usage.roles | join(sep=",") }}"'

[tasks.role.env]
ANSIBLE_CONFIG = "ansible.cfg"
