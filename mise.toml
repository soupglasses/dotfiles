[tools]
ansible = "14.3.1"
gitleaks = "8.30.1"
hk = "1.58.1"
uv = "0.12.17"
yamllint = "1.38.0"

[hooks]
postinstall = ["mise run --skip-tools setup", "hk install --mise"]

[tasks.setup]
description = "Install Ansible collections"
run = "ansible-galaxy collection install -r requirements.yml"

[tasks.check]
description = "Run all repository checks"
run = "hk check --all"

[tasks.apply]
description = "Apply the complete configuration, optionally limited to roles or tags"
usage = 'arg "[roles]" var=#true help="Roles or tags to apply"'
run = '''
ansible-playbook --inventory "localhost," site.yaml{% if usage.roles | length > 0 %} --tags {{ usage.roles | join(sep=",") | quote }}{% endif %}
'''

[tasks.apply.env]
ANSIBLE_CONFIG = "ansible.cfg"
