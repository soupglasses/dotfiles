# vim:fileencoding=utf-8:ft=conf
#
# macOS-specific settings. Included unconditionally from kitty.conf: kitty
# accepts macos_* options on every platform and ignores them elsewhere, so this
# needs no per-machine generation.

# Make the left option key send Escape, which is what readline and neovim
# expect from a meta key. The right one stays as-is, for typing ø/æ/å.
macos_option_as_alt left

macos_quit_when_last_window_closed yes
macos_titlebar_color background
