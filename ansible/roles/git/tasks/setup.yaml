- name: Configure (RedHat)
  include_tasks: ./redhat.yaml
  when: ansible_facts['os_family'] == "RedHat"

- name: Configure (Suse)
  include_tasks: ./suse.yaml
  when: ansible_facts['os_family'] == "Suse"

- name: Configure (Archlinux)
  include_tasks: ./archlinux.yaml
  when: ansible_facts['os_family'] == "Archlinux"

- name: Configure (Darwin)
  include_tasks: ./darwin.yaml
  when: ansible_facts['os_family'] == "Darwin"

- name: Create .config/git directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/git"
    state: directory
    mode: "0755"

- name: Stow git
  stow:
    src: "{{ role_path }}/files"
    dest: "{{ ansible_env.HOME }}"
    package: [git]
    # ~/.config/git/config is a local file that git itself writes to (any
    # `git config --global`), so this directory must never become a symlink
    # into this repository.
    folding: false


# git reads ~/.config/git/config only when ~/.gitconfig is absent, and it is
# ~/.gitconfig that `git config --global` creates once anything has written
# there. On a machine where that already happened, a block in the XDG file
# would be silently ignored, so the block goes wherever git will actually read
# it from.
- name: Check whether ~/.gitconfig takes precedence
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.gitconfig"
  register: git_home_config

- name: Select the git config file to manage
  ansible.builtin.set_fact:
    git_config_file: >-
      {{ ansible_env.HOME ~ ('/.gitconfig' if git_home_config.stat.exists
                             else '/.config/git/config') }}

# Only the include lines are managed. The rest of the file is left alone, so
# anything written by `git config --global` or by machine-specific tooling
# survives a re-run. The include paths are absolute because a relative path
# resolves against the including file's own directory, which differs between
# ~/.gitconfig and ~/.config/git/config.
- name: Add include sourcing block to the git config
  ansible.builtin.blockinfile:
    path: "{{ git_config_file }}"
    block: |
      [include]
          path = {{ ansible_env.HOME }}/.config/git/base
          path = {{ ansible_env.HOME }}/.config/git/difftastic
          path = {{ ansible_env.HOME }}/.config/git/aliases
          path = {{ ansible_env.HOME }}/.config/git/{{ 'credential-darwin' if ansible_facts['os_family'] == 'Darwin' else 'credential-linux' }}
          path = {{ ansible_env.HOME }}/.config/git/personal
    marker: "# {mark} ANSIBLE MANAGED BLOCK - include"
    create: true
    mode: "0644"
