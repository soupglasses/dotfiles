- name: Configure (RedHat)
  include_tasks: ./redhat.yaml
  when: ansible_facts['os_family'] == "RedHat"

- name: Configure (Suse)
  include_tasks: ./suse.yaml
  when: ansible_facts['os_family'] == "Suse"

- name: Configure (Archlinux)
  include_tasks: ./archlinux.yaml
  when: ansible_facts['os_family'] == "Archlinux"

- name: Configure (Darwin)
  include_tasks: ./darwin.yaml
  when: ansible_facts['os_family'] == "Darwin"

- name: Create .config/git directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/git"
    state: directory
    mode: "0755"

- name: Stow git
  soupglasses.stow.stow:
    src: "{{ role_path }}/files"
    dest: "{{ ansible_env.HOME }}"
    package: [git]
    # ~/.config/git/config is a local file that git itself writes to (any
    # `git config --global`), so this directory must never become a symlink
    # into this repository.
    folding: false

- name: Remove legacy personal remote include file
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/git/personal-remotes"
    state: absent

- name: Remove legacy personal remote include block
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.config/git/config"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - personal-remotes"
    state: absent

# Git gives ~/.gitconfig precedence over the XDG config. Remove that legacy
# location so every machine consistently uses ~/.config/git/config.
- name: Remove legacy ~/.gitconfig
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.gitconfig"
    state: absent

# Only the include lines are managed. The rest of the XDG config is left alone,
# so settings written by `git config --global` or machine-specific tooling
# survive a re-run.
- name: Add include sourcing block to the git config
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.config/git/config"
    block: |
      [include]
          path = {{ ansible_env.HOME }}/.config/git/base
          path = {{ ansible_env.HOME }}/.config/git/difftastic
          path = {{ ansible_env.HOME }}/.config/git/aliases
          path = {{ ansible_env.HOME }}/.config/git/{{ 'credential-darwin' if ansible_facts['os_family'] == 'Darwin' else 'credential-linux' }}
          path = {{ ansible_env.HOME }}/.config/git/profiles/personal
    marker: "# {mark} ANSIBLE MANAGED BLOCK - include"
    create: true
    mode: "0644"

# Keep remote-based routing last. A machine-local role may insert a different
# default profile before this block; matching remotes can then restore or refine
# the selected profile.
- name: Add remote profile routing
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.config/git/config"
    block: |
      [include]
          path = {{ ansible_env.HOME }}/.config/git/remotes
    marker: "# {mark} ANSIBLE MANAGED BLOCK - remote-profiles"
    create: true
    mode: "0644"
