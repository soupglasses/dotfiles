---
- name: Install dual-function-keys (Suse)
  include_tasks: ./suse.yaml
  when: ansible_facts['os_family'] == "Suse"

- name: Install dual-function-keys (RedHat)
  include_tasks: ./redhat.yaml
  when: ansible_facts['os_family'] == "RedHat"

- name: Ensure /etc/interception directory exists
  ansible.builtin.file:
    path: /etc/interception
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy interception configs
  ansible.builtin.copy:
    src: configs/
    dest: /etc/interception/
    owner: root
    group: root
    mode: "0644"
  notify:
    - restart udevmon

- name: Ensure udevmon service is enabled and started
  ansible.builtin.systemd:
    name: udevmon
    enabled: true
    state: started
