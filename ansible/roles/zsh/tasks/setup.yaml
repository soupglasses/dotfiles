---
# Only macOS uses zsh; the Linux machines use bash. See the shell role.
- name: Install dependencies (Darwin)
  include_tasks: ./darwin.yaml
  when: ansible_facts['os_family'] == "Darwin"

# Drop-ins load in numeric order, and other roles write here too. The numbers
# describe initialization stages rather than individual tools:
#   00-29  shell options, environment, history, and early toolchains
#   30-79  completion styles, fpath producers, aliases, and ordinary hooks
#   80     compinit: the single completion-system initialization boundary
#   81-98  tools that call compdef and therefore require compinit first
#   99     syntax highlighting, which must wrap every previously-created widget
#
# Keep every fpath modification before 80-compinit.zsh. Put generated init code
# that calls compdef (currently Docker and zoxide) after it. Never add a second
# compinit: duplicate initialization is slower and makes ordering harder to
# reason about.
- name: Create .zshrc.d directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.zshrc.d"
    state: directory
    mode: "0755"

# These names predate the staged completion ordering above. Remove them
# explicitly because stow creates the replacement links but does not remove an
# obsolete link or a snippet previously generated by another role.
- name: Remove legacy completion-order snippets
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.zshrc.d/{{ item }}"
    state: absent
  loop:
    - 50-docker.zsh
    - 98-compinit.zsh

- name: Stow zsh
  soupglasses.stow.stow:
    src: "{{ role_path }}/files"
    dest: "{{ ansible_env.HOME }}"
    package: [zsh]
    # Other roles generate snippets directly into ~/.zshrc.d, so the directory
    # must stay a real directory rather than a symlink into this repository.
    folding: false

- name: Add .zshrc.d sourcing block to .zshrc
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    block: |
      if [[ -d ~/.zshrc.d ]]; then
        for _rc in ~/.zshrc.d/*.zsh(Nn); do
          [[ -r "$_rc" ]] && source "$_rc"
        done
        unset _rc
      fi
    marker: "# {mark} ANSIBLE MANAGED BLOCK - zshrc.d"
    create: true
    mode: "0644"
