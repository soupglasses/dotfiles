---
- name: Install atuin (Suse)
  include_tasks: ./suse.yaml
  when: ansible_facts['os_family'] == "Suse"

- name: Check if atuin is already configured
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.local/share/atuin/session"
  register: atuin_session

- name: Prompt for Atuin credentials (first time setup)
  when: not atuin_session.stat.exists
  block:
    - name: Prompt for username
      ansible.builtin.pause:
        prompt: "Enter Atuin username"
        echo: true
      register: atuin_username
      run_once: true
      delegate_to: localhost

    - name: Prompt for password
      ansible.builtin.pause:
        prompt: "Enter Atuin password"
        echo: false
      register: atuin_password
      run_once: true
      delegate_to: localhost

    - name: Prompt for key
      ansible.builtin.pause:
        prompt: "Enter Atuin key"
        echo: false
      register: atuin_key
      run_once: true
      delegate_to: localhost

    - name: Run atuin login command
      ansible.builtin.command:
        cmd: >
          atuin login
          -u {{ atuin_username.user_input | quote }}
          -p {{ atuin_password.user_input | quote }}
          -k {{ atuin_key.user_input | quote }}
      notify: sync atuin
      no_log: true

- name: Configure bash
  include_tasks: bash.yaml
