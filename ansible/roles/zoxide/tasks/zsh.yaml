- name: Configure zoxide for zsh
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.zshrc.d/60-zoxide.zsh"
    content: |
      # Managed by Ansible (roles/zoxide).
      # Provides `z` for frecency-based directory jumping.
      if (( $+commands[zoxide] )); then
        eval "$(zoxide init zsh)"
      fi
    mode: "0644"
