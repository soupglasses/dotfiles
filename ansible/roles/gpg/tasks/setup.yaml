- name: Install (RedHat)
  include_tasks: ./redhat.yaml
  when: ansible_facts['os_family'] == "RedHat"

- name: Install (Suse)
  include_tasks: ./suse.yaml
  when: ansible_facts['os_family'] == "Suse"

- name: Install (Archlinux)
  include_tasks: ./archlinux.yaml
  when: ansible_facts['os_family'] == "Archlinux"

- name: Install (Darwin)
  include_tasks: ./darwin.yaml
  when: ansible_facts['os_family'] == "Darwin"

- name: Stow bash
  soupglasses.stow.stow:
    src: "{{ role_path }}/files"
    dest: "{{ ansible_env.HOME }}"
    package: [bash]
    # The bash role and every tool role also write into ~/.bashrc.d, so the
    # directory must stay real rather than fold into this repository.
    folding: false
  when: ansible_facts['system'] == "Linux"
  notify:
    - restart pcscd
    - restart gpg-agent (linux)
    - restart gpg-agent (darwin)

- name: Configure zsh
  include_tasks: zsh.yaml
  when: ansible_facts['os_family'] == "Darwin"

- name: Ensure ~/.gnupg directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.gnupg"
    state: directory
    mode: "0700"

- name: Stow gpg
  soupglasses.stow.stow:
    src: "{{ role_path }}/files"
    dest: "{{ ansible_env.HOME }}"
    package: [gpg]
    # gpg-agent writes its own state and sockets into ~/.gnupg.
    folding: false
  notify:
    - restart pcscd
    - restart gpg-agent (linux)
    - restart gpg-agent (darwin)

- name: Write ~/.gnupg/gpg-agent.conf
  ansible.builtin.template:
    src: gpg-agent.conf.j2
    dest: "{{ ansible_env.HOME }}/.gnupg/gpg-agent.conf"
    mode: "0600"
    # Earlier revisions stowed this file. Without this the template would write
    # through the leftover symlink into the repository.
    follow: false
  notify:
    - restart gpg-agent (linux)
    - restart gpg-agent (darwin)

- name: Ensure ~/.ssh directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: "0700"

- name: Stow ssh
  soupglasses.stow.stow:
    src: "{{ role_path }}/files"
    dest: "{{ ansible_env.HOME }}"
    package: [ssh]
    # ~/.ssh holds private keys and known_hosts, which must never be linked
    # into a public repository.
    folding: false

- name: Configure gpg-agent sockets (Linux)
  include_tasks: ./linux.yaml
  when: ansible_facts['system'] == "Linux"

- name: Check whether the public key is in the keyring
  ansible.builtin.command: gpg --list-keys {{ gpg_key_fingerprint }}
  register: gpg_public_key
  changed_when: false
  failed_when: false
  check_mode: false

- name: Import the public key
  ansible.builtin.command: gpg --recv-keys {{ gpg_key_fingerprint }}
  when: gpg_public_key.rc != 0

- name: Read ownertrust
  ansible.builtin.command: gpg --export-ownertrust
  register: gpg_ownertrust
  changed_when: false
  check_mode: false

# Own key, so ultimate trust. Without it gpg reports its own signatures as made
# by an untrusted key and git shows them as unverified.
- name: Trust the public key ultimately
  ansible.builtin.command: gpg --import-ownertrust
  args:
    stdin: "{{ gpg_key_fingerprint }}:6:"
  when: (gpg_key_fingerprint ~ ":6:") not in gpg_ownertrust.stdout

# Reading the card is what makes gpg create the secret-key stubs pointing at
# it. No-op when the YubiKey is not plugged in.
- name: Refresh the card key stubs
  ansible.builtin.command: gpg --card-status
  register: gpg_card_status
  changed_when: false
  failed_when: false
  check_mode: false
