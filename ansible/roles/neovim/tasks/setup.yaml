---
- name: Install (RedHat)
  include_tasks: ./redhat.yaml
  when: ansible_facts['os_family'] == "RedHat"

- name: Install (Suse)
  include_tasks: ./suse.yaml
  when: ansible_facts['os_family'] == "Suse"

- name: Install (Archlinux)
  include_tasks: ./archlinux.yaml
  when: ansible_facts['os_family'] == "Archlinux"

- name: Install (Darwin)
  include_tasks: ./darwin.yaml
  when: ansible_facts['os_family'] == "Darwin"

- name: Stow neovim
  stow:
    # This repository owns all of ~/.config/nvim, so folding stays on: one
    # directory symlink, and lazy-lock.json edits land straight back in the
    # repository. Neovim's runtime state lives in ~/.local/share/nvim, outside
    # the linked tree.
    src: "{{ role_path }}/files"
    dest: "{{ ansible_env.HOME }}"
    package: [neovim]
